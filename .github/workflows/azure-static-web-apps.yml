name: Deploy 405Network production
# Main-only delivery; see https://learn.microsoft.com/azure/static-web-apps/build-configuration
"on":
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: 405network-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/contact.test.cjs
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_405NETWORK_API_TOKEN }}
          action: upload
          app_location: website
          api_location: ''
          output_location: ''
          skip_app_build: true
          production_branch: main
